[project]
name = "kuclab-cneser"
version = "0.1.0"
description = "Censer .1 - a tiny from-scratch LLM that classifies English text as unsafe (1) or safe (0)."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9",
    "datasets>=3.0",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kuclab-cneser = "kuclab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuclab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
